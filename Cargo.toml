[package]
name = "agent-unzip"
version = "0.3.0"
edition = "2021"
build = "build.rs"
description = "代理解压缩：为 Agent 设计的解压器，结构化输出、永不阻塞、默认拒绝危险包"

[[bin]]
name = "aunzip"
path = "src/main.rs"

[lib]
name = "agent_unzip"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
zip = "9"
tar = "0.4"
flate2 = "1"
bzip2-rs = "0.1"
lzma-rs = "0.3"
encoding_rs = "0.8"
sevenz-rust2 = "0.25"
unrar = { version = "0.5", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
kamadak-exif = "0.6.2"
serde_json = "1.0.154"

[features]
default = ["rar"]
# RAR 解压（内嵌 UnRAR）。关掉它可得到一个「零非自由依赖」的构建，
# 便于进 Debian/Fedora 这类只收自由软件的仓库。
rar = ["dep:unrar"]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

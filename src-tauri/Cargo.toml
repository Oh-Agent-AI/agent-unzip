[package]
name = "pak-desktop"
version = "0.1.0"
edition = "2021"
description = "pak 解压器桌面版"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pak = { path = ".." }

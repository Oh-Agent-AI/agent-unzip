[package]
name = "pak-desktop"
version = "0.1.0"
edition = "2021"
description = "pak 解压器桌面版"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
# 用 NSWorkspace 代替 fork "open"：App Sandbox 下 fork/exec 会被拒
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pak = { path = ".." }
